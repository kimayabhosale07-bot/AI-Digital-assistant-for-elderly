<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency Contacts | Carewise</title>
  <meta name="description" content="Manage family members, caregivers, and emergency contacts with Carewise." />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <!-- Top App Navigation -->
  <header class="app-nav">
    <a class="nav-brand" href="dashboard.html">
      <div class="brand-icon">
        <img src="../assets/aistudio/central_brain.png" alt="Carewise logo" />
      </div>
      <span class="brand-title">carewise</span>
      <span class="brand-leaf">🌿</span>
    </a>

    <nav class="nav-links">
      <a href="dashboard.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Dashboard
      </a>
      <a href="reminders.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3M19 12a7 7 0 1 1-14 0 7 7 0 0 1 14 0z"/></svg>
        Medicines
      </a>
      <a href="appointments.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Appointments
      </a>
      <a href="health.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        Health Vitals
      </a>
      <a href="sos.html" class="nav-link" style="color:#D32F2F;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Emergency SOS
      </a>
    </nav>

    <div class="nav-user">
      <div class="user-badge">
        <span>👤</span>
        <span id="user-display-name">User</span>
      </div>
      <button class="btn-nav-logout" onclick="window.CareMateAPI.logoutUser()">Sign out</button>
    </div>
  </header>

  <!-- Page Content -->
  <main class="page-container">
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:1rem;">
      <div>
        <h1 class="page-title">Family &amp; Emergency Contacts</h1>
        <p class="page-subtitle">Caregivers, children, and physicians receiving automatic notifications.</p>
      </div>
      <a href="sos.html" class="btn btn-danger" style="font-size:0.85rem;">
        🚨 Emergency SOS Page
      </a>
    </div>

    <!-- Contacts List -->
    <div id="contacts-list" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:1.25rem;">
      <div style="grid-column: 1 / -1; text-align:center; padding:3rem; color:var(--text-muted);">
        Loading emergency contacts...
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script>
    'use strict';

    const userId = window.CareMateAPI.getCurrentUserId();
    if (!userId) window.location.href = 'login.html';

    const userName = localStorage.getItem('caremate_user_name') || 'User';
    document.getElementById('user-display-name').textContent = userName;

    async function loadProfileContacts() {
      const container = document.getElementById('contacts-list');
      try {
        const res = await window.CareMateAPI.getUserProfile(userId);
        if (res.success && res.data && Array.isArray(res.data.emergencyContacts) && res.data.emergencyContacts.length > 0) {
          container.innerHTML = res.data.emergencyContacts.map(c => `
            <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <span style="font-size:1.6rem; display:block; margin-bottom:0.25rem;">👨‍👩‍👧</span>
                <h3 style="font-size:1.2rem; color:var(--terra-main); margin-bottom:0.2rem; font-family:inherit; font-weight:800;">
                  ${escapeHtml(c.name)}
                </h3>
                <span style="font-size:0.85rem; color:var(--text-muted); font-weight:700;">
                  ${escapeHtml(c.relation || 'Emergency Contact')}
                </span>
              </div>
              <div>
                <a href="tel:${escapeHtml(c.phone)}" class="btn btn-sage" style="font-size:0.85rem; padding:0.5rem 1rem;">
                  📞 Call
                </a>
              </div>
            </div>
          `).join('');
        } else {
          container.innerHTML = `
            <div class="card" style="grid-column: 1 / -1; text-align:center; padding:3rem 1rem;">
              <p style="font-size:1.2rem; font-weight:700; color:var(--terra-main); margin-bottom:0.4rem;">No contacts registered</p>
              <p style="font-size:0.9rem; color:var(--text-muted);">When registering your profile, add emergency family numbers for instant SMS dispatch.</p>
            </div>
          `;
        }
      } catch (e) {
        container.innerHTML = `<div style="color:var(--text-muted);">Could not load contacts from server.</div>`;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    loadProfileContacts();
  </script>
</body>
</html>
