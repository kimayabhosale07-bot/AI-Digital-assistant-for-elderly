<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carewise | AI Companion for Elderly Care</title>
  <meta name="description" content="An AI companion that helps your elderly stay connected, independent and supported — one word at a time." />
  <meta property="og:title" content="Carewise | AI Companion for Elderly Care" />
  <meta property="og:description" content="An AI companion that helps your elderly stay connected, independent and supported — one word at a time." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg-cream:#FAF2E9;--bg-warm:#F5EAD9;
      --terra:#82382C;--terra-dark:#6F2E23;--terra-btn:#9E4536;--terra-btn-hv:#7A3026;--terra-light:#F3C4BA;
      --sage-brand:#3D543F;--sage-nav:#4C5E4E;--sage-light:#D6E0D7;
      --text-main:#5F524C;--text-sub:#695850;--text-muted:#8A7870;
      --border-warm:#E8DAD0;--white:#FFFFFF;
      --shadow-sm:0 2px 12px rgba(130,56,44,0.07);--shadow-md:0 8px 32px rgba(130,56,44,0.10);--shadow-lg:0 16px 48px rgba(130,56,44,0.14);
      --ease-spring:cubic-bezier(0.34,1.56,0.64,1);--ease-out:cubic-bezier(0.25,0.46,0.45,0.94)
    }
    html{height:100%;overflow-x:hidden;scroll-behavior:smooth}
    body{min-height:100%;background:var(--bg-cream);font-family:'Nunito',system-ui,-apple-system,sans-serif;color:var(--text-main);-webkit-font-smoothing:antialiased;overflow-x:hidden}
    ::selection{background:#F3C4BA;color:#753326}

    .landing-header{position:relative;z-index:2;width:100%;max-width:1760px;min-height:76px;margin:0 auto;padding:.2rem clamp(1rem,2vw,2rem);display:flex;align-items:center;justify-content:space-between;gap:1rem}
    .landing-brand{display:inline-flex;align-items:center;text-decoration:none;min-width:0}
    .landing-brand img{display:block;width:235px;height:70px;object-fit:cover;object-position:center;mix-blend-mode:multiply}
    .landing-cta{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.65rem 1.35rem;border:0;border-radius:9999px;background:var(--terra-btn);color:#fff;text-decoration:none;font:800 .95rem 'Nunito',sans-serif;box-shadow:0 4px 18px rgba(158,69,54,.2);transition:background .2s,transform .2s;white-space:nowrap}
    .landing-cta:hover{background:var(--terra-btn-hv);transform:translateY(-1px)}
    .landing-cta:focus-visible,.landing-brand:focus-visible{outline:3px solid var(--terra-btn);outline-offset:3px}

    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeInRight{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
    @keyframes brainBreathe{0%,100%{transform:scale(1);filter:drop-shadow(0 4px 14px rgba(247,196,186,0.25))}50%{transform:scale(1.028);filter:drop-shadow(0 6px 22px rgba(247,196,186,0.55))}}
    @keyframes gentleFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(0.5deg)}}
    @keyframes gentleFloatAlt{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(-0.4deg)}}
    @keyframes floatHeart{0%,100%{transform:translateY(0) rotate(-5deg);opacity:.55}50%{transform:translateY(-14px) rotate(5deg);opacity:.9}}
    @keyframes leafSway{0%,100%{transform:rotate(0deg)}33%{transform:rotate(3.5deg)}66%{transform:rotate(-2.5deg)}}
    @keyframes sparkle{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1.35)}}
    @keyframes dotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
    @keyframes ctaRing{0%{box-shadow:0 0 0 0 rgba(158,69,54,0.4),var(--shadow-md)}70%{box-shadow:0 0 0 14px rgba(158,69,54,0),var(--shadow-md)}100%{box-shadow:0 0 0 0 rgba(158,69,54,0),var(--shadow-md)}}
    @keyframes badgeSlide{from{opacity:0;transform:translateY(-8px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}

    /* ---- HERO ---- */
    .hero {
      position: relative;
      width: 100%;
      min-height: calc(100svh - 76px);
      padding: 0;
      background: var(--bg-cream);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .hero-container {
      width: 100%;
      max-width: 1760px;
      margin: 0 auto;
      padding: 0.25rem clamp(1rem, 2vw, 2rem);
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.25fr);
      gap: clamp(1rem, 2.4vw, 2rem);
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* Left Column: Cohesive Visual Cluster */
    .hero-left-cluster {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: auto auto auto;
      gap: 0.75rem;
      align-items: center;
      justify-items: center;
      max-width: 740px;
      margin: 0 auto;
      width: 100%;
    }
    .cluster-card {
      background: transparent;
      padding: 0;
      position: relative;
      width: 100%;
      max-width: 245px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
    }
    .cluster-card img {
      width: 100%;
      height: auto;
      display: block;
      mix-blend-mode: multiply;
      height: auto;
      display: block;
      mix-blend-mode: multiply;
      pointer-events: none;
    }
    .cluster-brain {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
    }
    .cluster-brain img {
      width: 100%;
      max-width: 185px;
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 14px rgba(247, 196, 186, 0.45));
    }
    .cluster-card-bottom {
      grid-column: 2;
      grid-row: 3;
    }

    /* Right Column: Content + Couple */
    .hero-right-col {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(210px, 0.9fr);
      gap: clamp(1rem, 2vw, 1.75rem);
      align-items: center;
      width: 100%;
    }
    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 1.1rem;
      border-radius: 9999px;
      background: var(--sage-light);
      color: var(--sage-brand);
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      margin-bottom: 1.1rem;
      border: 1px solid rgba(76, 94, 78, 0.2);
    }
    .hero-headline {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(2rem, 3vw, 3.1rem);
      font-weight: 600;
      color: var(--terra);
      line-height: 1.15;
      margin-bottom: 1rem;
      max-width: 100%;
    }
    .hero-headline em {
      font-style: italic;
      color: var(--terra-btn);
    }
    .hero-heart-inline {
      display: inline-block;
      font-size: 0.9em;
      color: var(--terra-btn);
    }
    .hero-sub {
      font-size: clamp(0.92rem, 1.1vw, 1.05rem);
      color: var(--text-sub);
      line-height: 1.65;
      max-width: 25rem;
      margin-bottom: 0.85rem;
    }

    /* Couple illustration block */
    .hero-couple-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      max-width: 440px;
      justify-self: center;
    }
    .hero-quote {
      font-family: 'Caveat', cursive;
      font-size: clamp(0.95rem, 1.25vw, 1.15rem);
      color: var(--terra);
      line-height: 1.35;
      text-align: center;
      margin-bottom: 0.75rem;
      transform: rotate(3deg);
      user-select: none;
    }
    .hero-quote .heart {
      color: var(--terra-btn);
      font-size: 1.15em;
    }
    .family-illustration {
      width: 100%;
      display: block;
      user-select: none;
    }
    .family-illustration img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    /* Botanical leaves */
    .leaf-deco {
      position: absolute;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
      user-select: none;
    }
    .leaf-tr {
      top: 0;
      right: 0;
      width: clamp(60px, 8vw, 110px);
    }
    .leaf-bl {
      bottom: 0;
      left: 0;
      width: clamp(50px, 7vw, 95px);
    }
    .svg-leaf {
      display: block;
    }

    /* Tablet breakpoint (768px - 1024px) */
    @media (min-width: 768px) and (max-width: 1024px) {
      .hero-container {
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(145px, 0.65fr);
        gap: 0.75rem;
        padding: 0.75rem 1.25rem;
      }
      .hero-right-col {
        display: contents;
      }
      .hero-left-cluster {
        max-width: 360px;
        gap: 0.4rem;
      }
      .cluster-card {
        max-width: 140px;
        padding: 0.2rem;
      }
      .cluster-brain img {
        max-width: 100px;
      }
      .hero-content {
        grid-column: 2;
      }
      .hero-couple-block {
        grid-column: 3;
        max-width: 190px;
      }
      .hero-badge {
        gap: 0.25rem;
        padding: 0.3rem 0.6rem;
        font-size: 0.58rem;
        letter-spacing: 0.07em;
        margin-bottom: 0.65rem;
      }
      .hero-headline {
        font-size: clamp(1.5rem, 3vw, 2rem);
        line-height: 1.1;
        margin-bottom: 0.65rem;
      }
      .hero-sub {
        font-size: 0.82rem;
        line-height: 1.5;
        margin-bottom: 1rem;
      }
      .hero-quote {
        font-size: 0.95rem;
        margin-bottom: 0.35rem;
      }
    }

    /* Mobile breakpoint (<768px) */
    @media (max-width: 767px) {
      .landing-brand img{width:175px;height:54px}
      .landing-cta{padding:.6rem 1rem;font-size:.9rem}
      .landing-header{min-height:62px;padding:.2rem 1rem}
      .hero {
        min-height: 0;
      }
      .hero-container {
        grid-template-columns: 1fr;
        gap: 0.75rem;
        padding: 0.2rem 0.5rem 0.5rem;
      }
      .hero-left-cluster {
        grid-template-columns: repeat(3, 1fr);
        gap: 0.35rem;
        max-width: 320px;
        margin: 0 auto;
        width: 100%;
        box-sizing: border-box;
      }
      .cluster-card {
        padding: 0;
      }
      .cluster-brain img {
        max-width: 80px;
      }
      .hero-right-col {
        grid-template-columns: minmax(0, 1fr) minmax(120px, 0.6fr);
        gap: 0.5rem;
        text-align: left;
        justify-items: stretch;
      }
      .hero-content {
        align-items: flex-start;
        text-align: left;
      }
      .hero-badge {
        margin: 0 0 0.55rem;
        padding: 0.3rem 0.55rem;
        gap: 0.25rem;
        font-size: 0.55rem;
        letter-spacing: 0.06em;
      }
      .hero-headline {
        font-size: clamp(1.55rem, 7vw, 1.9rem);
        line-height: 1.08;
        text-align: left;
        margin-bottom: 0.55rem;
      }
      .hero-sub {
        text-align: left;
        margin: 0 0 0.75rem;
        max-width: none;
        font-size: 0.84rem;
        line-height: 1.45;
      }
      .hero-couple-block {
        max-width: 138px;
        margin: 0 auto;
      }
      .hero-quote {
        margin-bottom: 0.25rem;
        transform: rotate(1deg);
        font-size: 0.85rem;
      }
      .leaf-tr { width: 45px; }
      .leaf-bl { width: 35px; }
    }
  </style>
</head>
<body>
  <header class="landing-header">
    <a class="landing-brand" href="index.html" aria-label="Carewise home">
      <img src="../assets/aistudio/carewise_wordmark.png" alt="Carewise" width="270" height="82" />
    </a>
    <a href="login.html" class="landing-cta" id="btn-landing-start">Get Started</a>
  </header>

  <!-- HERO -->
  <section class="hero" id="hero" aria-label="Care for them, even when you can't be there">
    <!-- Botanical leaf decorations (SVG) -->
    <svg class="leaf-deco leaf-tr svg-leaf" viewBox="0 0 120 140" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M110 10 C90 40 60 50 40 90 C70 70 100 55 115 20Z" fill="#8BAF8D" opacity="0.55"/>
      <path d="M95 5 C80 35 55 45 35 82 C62 65 88 50 100 15Z" fill="#5C8860" opacity="0.40"/>
      <path d="M115 25 C98 55 72 62 52 98 C78 80 106 65 120 32Z" fill="#A8C5A8" opacity="0.35"/>
      <line x1="75" y1="50" x2="40" y2="90" stroke="#6A9E6C" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="90" y1="30" x2="58" y2="68" stroke="#6A9E6C" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    </svg>
    <svg class="leaf-deco leaf-bl svg-leaf" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M10 115 C30 85 60 75 80 35 C50 55 20 70 5 105Z" fill="#8BAF8D" opacity="0.5"/>
      <path d="M20 118 C38 90 65 80 82 42 C55 62 28 76 12 110Z" fill="#5C8860" opacity="0.35"/>
      <line x1="45" y1="75" x2="80" y2="35" stroke="#6A9E6C" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    </svg>

    <div class="hero-container">
      <!-- LEFT: Cohesive Thought-Bubble Cluster -->
      <div class="hero-left-cluster" aria-label="Thought bubbles showing Carewise features">
        <!-- Row 1: Top 3 bubbles -->
        <div class="cluster-card">
          <img src="../assets/aistudio/bubble_1.png" alt="What if a call, a reminder, or a hello was never out of reach?" />
        </div>

        <div class="cluster-card">
          <img src="../assets/aistudio/bubble_2.png" alt="Wondering if they've taken their medicine today?" />
        </div>

        <div class="cluster-card">
          <img src="../assets/aistudio/bubble_3.png" alt="Want someone patient looking out for them when you can't be there?" />
        </div>

        <!-- Row 2: Mid Left Bubble, Center Brain, Mid Right Bubble -->
        <div class="cluster-card">
          <img src="../assets/aistudio/bubble_4.png" alt="What if they could do it themselves, with help just a word away?" />
        </div>

        <div class="cluster-brain" aria-label="Carewise AI companion">
          <img src="../assets/aistudio/central_brain.png" alt="Carewise AI companion brain" width="140" height="90" />
        </div>

        <div class="cluster-card">
          <img src="../assets/aistudio/bubble_6.png" alt="Family caregiver support for everyday care" />
        </div>

        <!-- Row 3: Centered Bottom Bubble -->
        <div class="cluster-card cluster-card-bottom">
          <img src="../assets/aistudio/bubble_5.png" alt="Need a helping hand in caring for the people who cared for you?" />
        </div>
      </div>

      <!-- RIGHT: Headline + Description + CTA + Blended Elderly Couple -->
      <div class="hero-right-col">
        <!-- Text Block -->
      <div class="hero-content">
          <div class="hero-badge" aria-label="Care, just a word away">
            <span aria-hidden="true">\ \</span> Care, Just a Word Away <span aria-hidden="true">/ /</span>
          </div>
          <h1 class="hero-headline">
            Care for them,<br>
            even when you<br>
            <em>can't be there.</em>&nbsp;<span class="hero-heart-inline" aria-hidden="true">&#9825;</span>
          </h1>
          <p class="hero-sub">
            An AI companion that helps your elderly stay connected, independent and supported &mdash; one word at a time.
          </p>
        </div>

        <!-- Blended Artwork Block -->
        <div class="hero-couple-block">
          <div class="hero-quote" aria-hidden="true">
            Because they deserve<br>
            the same care they<br>
            gave you. <span class="heart">&#9825;</span>
          </div>
          <div class="family-illustration">
            <img src="../assets/aistudio/family_sofa.png" alt="Elderly couple and daughter relaxing together on sofa" draggable="false" width="290" />
          </div>
        </div>
      </div>
    </div>

  </section>
  <script>
    'use strict';
    if (localStorage.getItem('caremate_user_id')) {
      document.getElementById('btn-landing-start').setAttribute('href', 'dashboard.html');
    }
  </script>
</body>
</html>
